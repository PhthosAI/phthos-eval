[project]
name = "phthos-eval"
version = "0.1.0"
description = "Offline agent eval: deterministic scorers and a diagnosis artifact."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
phthos-eval = "phthos_eval.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phthos_eval = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
