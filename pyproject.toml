[project]
name = "phthos-eval"
version = "0.6.3"
description = "Offline, self-host, and hosted live agent eval: same scorers, diagnosis JSON. Cloud extras are ops, not scores."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "PhthosAI" }]
keywords = ["eval", "agents", "llm"]
urls = { Homepage = "https://github.com/PhthosAI/phthos-eval", Repository = "https://github.com/PhthosAI/phthos-eval" }

[project.scripts]
phthos-eval = "phthos_eval.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phthos_eval = ["py.typed", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
