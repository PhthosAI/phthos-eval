# Copy into a consumer repo as .github/workflows/eval.yml
# Fails the job when phthos-eval reports findings.
# Default: OSS lib on the runner (no Docker, no cloud).
# Hosted alternative: LiveClient(PHTHOS_EVAL_CLOUD_URL, api_key=PHTHOS_EVAL_CLOUD_KEY)
# then put_dataset + run_dataset — same diagnosis schema. See docs/hosted.md.
name: agent-eval
on:
  push:
  pull_request:
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install phthos-eval
      - run: python -m phthos_eval run -d eval/dataset.json -o diagnosis.json --fail-on-findings
      - run: python -m phthos_eval check diagnosis.json
