<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280" role="img" aria-labelledby="title">
  <title id="title">Live engine: ingest does not block, then sample and score</title>
  <rect width="880" height="280" fill="#f6f8fa"/>
  <text x="24" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Live path  agent is never blocked</text>

  <rect x="24" y="56" width="140" height="72" rx="8" fill="#fff" stroke="#d0d7de"/>
  <text x="94" y="86" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#1f2328">Agent request</text>
  <text x="94" y="106" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#656d76">finishes as usual</text>

  <path d="M164 92 H200" stroke="#656d76" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="200" y="56" width="140" height="72" rx="8" fill="#fff" stroke="#d0d7de"/>
  <text x="270" y="86" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#1f2328">POST /v1/traces</text>
  <text x="270" y="106" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#656d76">202 accepted</text>

  <path d="M340 92 H376" stroke="#656d76" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="376" y="48" width="168" height="88" rx="8" fill="#fff" stroke="#1a7f37" stroke-width="2"/>
  <text x="460" y="78" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1a7f37">Sample ~5%</text>
  <text x="460" y="98" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#656d76">95% dropped here</text>
  <text x="460" y="116" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#656d76">judge still off</text>

  <path d="M544 92 H580" stroke="#656d76" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="580" y="56" width="140" height="72" rx="8" fill="#fff" stroke="#d0d7de"/>
  <text x="650" y="86" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#1f2328">Async score</text>
  <text x="650" y="106" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#656d76">same scorers</text>

  <path d="M720 92 H756" stroke="#656d76" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="756" y="56" width="100" height="72" rx="8" fill="#fff" stroke="#d0d7de"/>
  <text x="806" y="86" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#1f2328">UI / API</text>
  <text x="806" y="106" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#656d76">SQLite</text>

  <!-- live UI mock -->
  <rect x="24" y="156" width="832" height="100" rx="8" fill="#fff" stroke="#d0d7de"/>
  <text x="40" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2328">Live UI (self-host)  not a trace explorer</text>
  <rect x="40" y="196" width="120" height="40" rx="4" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="100" y="213" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a7f37">62%</text>
  <text x="100" y="228" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#656d76">pass rate</text>
  <rect x="172" y="196" width="120" height="40" rx="4" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="232" y="213" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">0.041</text>
  <text x="232" y="228" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#656d76">cost USD</text>
  <rect x="304" y="196" width="120" height="40" rx="4" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="364" y="213" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#cf222e">3</text>
  <text x="364" y="228" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#656d76">policy hits</text>
  <text x="456" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#656d76">open a sampled run ’ diagnosis JSON · save to offline dataset</text>
  <text x="456" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#656d76">no prompt editor · no fix this for me</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#656d76"/>
    </marker>
  </defs>
</svg>
