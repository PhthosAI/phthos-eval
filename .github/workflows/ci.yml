name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m pytest
      - run: python -m phthos_eval run -d fixtures/dataset.json -o diagnosis.json
      - run: python -m phthos_eval check diagnosis.json
      - run: python -m phthos_eval run -d examples/support_agent/dataset.json -o support.json
